    <style>
        :root {
            --bg-main: #FFFFFF;
            --bg-pink: #F5EAE8;
            --bg-cream: #FAF6F4;

            --text-muted: #7C6D68;
            --accent-taupe: #9E8A84;
            --accent-hover: #826F69;
            --border-color: #EADCD9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Header */
        header {
            background-color: var(--bg-main);
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.85rem;
            font-weight: 600;
            color: var(--text-dark);
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .nav-pill-btn {
            background-color: var(--bg-pink);
            color: var(--text-dark);
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }

        .nav-pill-btn:hover {
            background-color: var(--accent-taupe);
            color: white;
        }

        /* Hero Banner */
        .hero-banner {
            background-color: var(--bg-pink);
            padding: 60px 6%;
            text-align: center;
        }

        .hero-banner h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        .hero-banner p {
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto;
            font-size: 0.95rem;
        }

        /* Catalog Toolbar (เหมือน uninote: ไม่มีปุ่มแยก Midterm/Final) */
        .catalog-toolbar {
            max-width: 1140px;
            margin: 35px auto 20px;
            padding: 0 5% 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            padding: 9px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.88rem;
            width: 260px;
            outline: none;
            background-color: var(--bg-cream);
            color: var(--text-dark);
        }

        .search-box:focus {
            border-color: var(--accent-taupe);
            background-color: #FFFFFF;
        }

        .item-count {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

            max-width: 1140px;
            margin: 0 auto;
            padding: 15px 5% 70px;
