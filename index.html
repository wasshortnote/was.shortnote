<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>was.shortnote | สรุปรายวิชาที่เปิดจำหน่าย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #FAF6F4;
            --bg-card: #FFFFFF;
            --bg-pink: #F5EAE8;
            --bg-pink-soft: #FBF4F3;
            --text-dark: #2C2827;
            --text-muted: #7C6D68;
            --accent-taupe: #9E8A84;
            --accent-hover: #826F69;
            --badge-mid-bg: #F3E5E2;
            --badge-mid-text: #6E5650;
            --badge-bundle-bg: #FDF3DF;
            --badge-bundle-text: #9C7832;
            --border-color: #EADCD9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Header */
        header {
            background-color: var(--bg-card);
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-dark);
            text-decoration: none;
        }

        .line-header-btn {
            background-color: var(--accent-taupe);
            color: #FFFFFF;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .line-header-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Main Container */
        .container {
            max-width: 720px;
            margin: 32px auto 0;
            padding: 0 18px;
        }

        /* Section Title & Info Box (เหมือนภาพตัวอย่าง) */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .section-icon {
            background-color: var(--accent-taupe);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .section-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .notice-banner {
            background-color: var(--bg-pink);
            border-left: 4px solid var(--accent-taupe);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 24px;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .notice-banner p {
            margin-bottom: 4px;
        }

        .notice-banner p:last-child {
            margin-bottom: 0;
        }

        /* Subject Card List */
        .subject-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .subject-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 22px;
            box-shadow: 0 4px 14px rgba(158, 138, 132, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .subject-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(158, 138, 132, 0.12);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .book-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background-color: var(--bg-pink-soft);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .subject-title-th {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1.3;
        }

        .subject-title-en {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        /* Price Row */
        .price-row {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--bg-page);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .price-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .price-pill {
            background-color: var(--badge-mid-bg);
            color: var(--badge-mid-text);
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* Card Bottom Actions */
        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .preview-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .preview-btn:hover {
            background-color: var(--bg-pink);
            border-color: var(--accent-taupe);
        }

        .bundle-pill {
            background-color: var(--badge-bundle-bg);
            color: var(--badge-bundle-text);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 8px;
        }

        /* Preview Modal (เหมือนภาพที่ 2) */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(44, 40, 39, 0.65);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 680px;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 92vh;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-page);
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Image Viewer Area */
        .viewer-area {
            position: relative;
            background-color: #F4EFEA;
            flex-grow: 1;
            min-height: 340px;
            max-height: 55vh;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .viewer-area.zoomed {
            align-items: flex-start;
            justify-content: flex-start;
        }

        .sample-img {
            max-width: 100%;
            max-height: 48vh;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
            cursor: zoom-in;
        }

        .viewer-area.zoomed .sample-img {
            max-width: none;
            max-height: none;
            width: 165%;
            cursor: zoom-out;
        }

        .nav-arrow {
            position: fixed;
            top: 48%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(158, 138, 132, 0.85);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .nav-arrow:hover {
            background: var(--text-dark);
        }

        .prev-arrow { left: max(24px, calc(50% - 315px)); }
        .next-arrow { right: max(24px, calc(50% - 315px)); }

        /* Viewer Controls (หน้า 1 จาก X + ซูมดูใกล้ๆ) */
        .viewer-controls {
            background-color: #F4EFEA;
            padding: 8px 16px 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .control-pill {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            color: var(--text-dark);
        }

        .zoom-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .zoom-btn:hover {
            background-color: var(--bg-pink);
        }

        /* Modal Footer */
        .modal-footer {
            padding: 16px 20px;
            background: #FFFFFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .modal-price-info {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .modal-bundle-note {
            font-size: 0.8rem;
            color: var(--badge-bundle-text);
            font-weight: 500;
        }

        .line-order-btn {
            background-color: var(--accent-taupe);
            color: #FFFFFF;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.88rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .line-order-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand-logo">was.shortnote</a>
        <a href="https://line.me/ti/p/@was.shortnote" target="_blank" class="line-header-btn">💬 ทักแชท Line ร้าน</a>
    </header>

    <div class="container">
        <div class="section-header">
            <div class="section-icon">📋</div>
            <h1>สรุปรายวิชาที่เปิดจำหน่าย</h1>
        </div>

        <div class="notice-banner">
            <p>📌 <strong>สรุปแบ่งเป็น Midterm และ Final</strong> แยกซื้อได้ตามต้องการ</p>
            <p>💡 หากสนใจวิชาไหน <strong>สามารถกดดูตัวอย่างได้เลย !</strong></p>
        </div>

        <div class="subject-list" id="subjectList"></div>
    </div>

    <!-- Modal ดูตัวอย่างหน้าชีท + ซูม + ลิงก์ไป Line -->
    <div class="modal-overlay" id="previewModal" onclick="if(event.target === this) closeModal()">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-header-left">
                    <div class="book-icon-box" id="modalIcon">📘</div>
                    <div>
                        <div class="subject-title-th" id="modalTitleTh">ชื่อวิชา</div>
                        <div class="subject-title-en" id="modalTitleEn">Subject Name • ตัวอย่างสรุปเนื้อหา</div>
                    </div>
                </div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="viewer-area" id="viewerArea">
                <button class="nav-arrow prev-arrow" id="prevBtn" onclick="changeSlide(-1)">‹</button>
                <img src="" alt="ตัวอย่างชีทสรุป" class="sample-img" id="sampleImg" onclick="toggleZoom()">
                <button class="nav-arrow next-arrow" id="nextBtn" onclick="changeSlide(1)">›</button>
            </div>

            <div class="viewer-controls">
                <span class="control-pill" id="pageIndicator">หน้า 1 จาก 2</span>
                <button class="control-pill zoom-btn" id="zoomBtn" onclick="toggleZoom()">🔍 ซูมดูใกล้ๆ</button>
            </div>

            <div class="modal-footer">
                <div>
                    <div class="modal-price-info" id="modalPriceText">Midterm 49 ฿ | Final 55 ฿</div>
                    <div class="modal-bundle-note" id="modalBundleText">⭐ ซื้อคู่เพียง 95 ฿</div>
                </div>
                <a href="#" target="_blank" class="line-order-btn" id="lineOrderLink">
                    💬 ทักแชทสั่งซื้อวิชานี้
                </a>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ตั้งค่าลิงก์ Line ของร้านตรงนี้
        // ==========================================
        const SHOP_LINE_URL = "https://line.me/ti/p/@was.shortnote"; 
        // (หากมี Line Official Account สามารถเปลี่ยนเป็น "https://lin.ee/รหัสของคุณ" ได้เลย)

        // ==========================================
        // 2. แก้ไขรายวิชา ราคา Midterm / Final / ซื้อคู่ และรูปตัวอย่างตรงนี้
        // ==========================================
        const subjects = [
            {
                icon: "📘",
                titleTh: "เศรษฐศาสตร์จุลภาค",
                titleEn: "Microeconomics",
                midPrice: "49 ฿",
                finalPrice: "55 ฿",
                bundlePrice: "95 ฿",
                // ใส่ลิงก์รูปภาพตัวอย่างชีทของวิชานี้ได้หลายรูป (คั่นด้วยลูกน้ำ)
                samples: [
                    "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=900&q=85",
                    "https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=900&q=85"
                ]
            },
            {
                icon: "📙",
                titleTh: "เศรษฐศาสตร์มหภาค",
                titleEn: "Macroeconomics",
                midPrice: "45 ฿",
                finalPrice: "49 ฿",
                bundlePrice: "85 ฿",
                samples: [
                    "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=900&q=85",
                    "https://images.unsplash.com/photo-1506784983877-45594efa4cbe?auto=format&fit=crop&w=900&q=85"
                ]
            },
            {
                icon: "📕",
                titleTh: "คณิตศาสตร์ธุรกิจ",
                titleEn: "Math for Business",
                midPrice: "39 ฿",
                finalPrice: "45 ฿",
                bundlePrice: "75 ฿",
                samples: [
                    "https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=900&q=85"
                ]
            },
            {
                icon: "📗",
                titleTh: "หลักการตลาด",
                titleEn: "Principles of Marketing",
                midPrice: "49 ฿",
                finalPrice: "49 ฿",
                bundlePrice: "89 ฿",
                samples: [
                    "https://images.unsplash.com/photo-1586281380349-632531db7ed4?auto=format&fit=crop&w=900&q=85"
                ]
            }
        ];

        let currentSubjectIndex = 0;
        let currentSlideIndex = 0;
        let isZoomed = false;

        // แสดงการ์ดรายวิชาทั้งหมดบนหน้าเว็บ
        function renderSubjects() {
            const listEl = document.getElementById('subjectList');
            listEl.innerHTML = subjects.map((sub, index) => `
                <div class="subject-card">
                    <div class="card-top">
                        <div class="book-icon-box">${sub.icon}</div>
                        <div>
                            <div class="subject-title-th">${sub.titleTh}</div>
                            <div class="subject-title-en">${sub.titleEn}</div>
                        </div>
                    </div>
                    <div class="price-row">
                        <div class="price-item">
                            <span>Midterm</span>
                            <span class="price-pill">${sub.midPrice}</span>
                        </div>
                        <div class="price-item">
                            <span>Final</span>
                            <span class="price-pill">${sub.finalPrice}</span>
                        </div>
                    </div>
                    <div class="card-bottom">
                        <button class="preview-btn" onclick="openPreview(${index})">
                            👁️ ขอดูตัวอย่าง
                        </button>
                        <span class="bundle-pill">ซื้อคู่ ${sub.bundlePrice}</span>
                    </div>
                </div>
            `).join('');
        }

        // เปิดหน้าต่างดูตัวอย่างชีท
        function openPreview(index) {
            currentSubjectIndex = index;
            currentSlideIndex = 0;
            resetZoom();

            const sub = subjects[index];
            document.getElementById('modalIcon').innerText = sub.icon;
            document.getElementById('modalTitleTh').innerText = sub.titleTh;
            document.getElementById('modalTitleEn').innerText = `${sub.titleEn} • ตัวอย่างสรุปเนื้อหา`;
            document.getElementById('modalPriceText').innerText = `Midterm ${sub.midPrice} | Final ${sub.finalPrice}`;
            document.getElementById('modalBundleText').innerText = `⭐ ซื้อคู่เพียง ${sub.bundlePrice}`;
            
            // ตั้งลิงก์ปุ่มทักแชทไปที่ Line ของร้าน
            document.getElementById('lineOrderLink').href = SHOP_LINE_URL;

            updateSlide();
            document.getElementById('previewModal').style.display = 'flex';
        }

        function updateSlide() {
            const sub = subjects[currentSubjectIndex];
            const total = sub.samples.length;
            document.getElementById('sampleImg').src = sub.samples[currentSlideIndex];
            document.getElementById('pageIndicator').innerText = `หน้า ${currentSlideIndex + 1} จาก ${total}`;

            // ซ่อนปุ่มเลื่อนถ้ามีแค่ 1 รูป
            document.getElementById('prevBtn').style.display = total > 1 ? 'flex' : 'none';
            document.getElementById('nextBtn').style.display = total > 1 ? 'flex' : 'none';
        }

        function changeSlide(step) {
            resetZoom();
            const total = subjects[currentSubjectIndex].samples.length;
            currentSlideIndex = (currentSlideIndex + step + total) % total;
            updateSlide();
        }

        function toggleZoom() {
            const viewer = document.getElementById('viewerArea');
            const zoomBtn = document.getElementById('zoomBtn');
            isZoomed = !isZoomed;

            if (isZoomed) {
                viewer.classList.add('zoomed');
                zoomBtn.innerHTML = '🔎 ย่อขนาดปกติ';
            } else {
                viewer.classList.remove('zoomed');
                zoomBtn.innerHTML = '🔍 ซูมดูใกล้ๆ';
            }
        }

        function resetZoom() {
            isZoomed = false;
            document.getElementById('viewerArea').classList.remove('zoomed');
            document.getElementById('zoomBtn').innerHTML = '🔍 ซูมดูใกล้ๆ';
        }

        function closeModal() {
            document.getElementById('previewModal').style.display = 'none';
            resetZoom();
        }

        renderSubjects();
    </script>
</body>
</html>
